server:
  port: 0
  servlet:
    context-path: /api/v1

voicepilot:
  version: "0.0.1-SNAPSHOT"

spring:
  application:
    name: voicepilot-backend-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
