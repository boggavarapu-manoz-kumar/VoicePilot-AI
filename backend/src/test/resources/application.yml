server:
  port: 0
  servlet:
    context-path: /api/v1

voicepilot:
  version: "0.0.1-SNAPSHOT"
  cors:
    allowed-origins: "http://localhost:5173"

spring:
  application:
    name: voicepilot-backend-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate # Validates schema created by Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
