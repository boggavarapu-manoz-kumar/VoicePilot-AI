server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

voicepilot:
  version: "0.0.1-SNAPSHOT"
  cors:
    allowed-origins: "http://localhost:5173,http://127.0.0.1:5173"

spring:
  application:
    name: voicepilot-backend-dev
  datasource:
    url: jdbc:h2:mem:voicepilot;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
